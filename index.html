<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Euclid216</title>
<meta name="description" content="Built for agents, coming online soon.">
<meta name="theme-color" content="#050607">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23050607'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='monospace' font-size='30' fill='%233ee0a0'%3E216%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap">
<style>
:root{--bg:#050607;--ink:#d9dde0;--ink2:#6b747b;--dim:#2a3137;--box:#0e1319;--box-edge:#1b232c;--trace:#182029;--lit:#3ee0a0;--lit-deep:#13865e;--now:#4fd9ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;overflow-x:hidden}
.field{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.field svg{position:absolute;inset:0;width:100%;height:100%}
.grain{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.14;mix-blend-mode:screen}
main{position:relative;z-index:2;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding-inline:16px;padding-block:0}
.top{display:flex;align-items:center;gap:clamp(12px,2vw,22px);padding-block:clamp(14px,2.5vh,28px) 0;max-width:1040px;width:100%;margin:0 auto}
.cube{width:clamp(72px,9vw,118px);height:auto;display:block;flex:none}
.name{font-weight:300;font-size:clamp(22px,3.2vw,40px);letter-spacing:.14em;line-height:1;white-space:nowrap;display:flex;align-items:center;gap:.08em;margin:0}
.name b{font-weight:500;color:var(--lit);text-shadow:0 0 12px rgba(62,224,160,.5)}
.cur{display:inline-block;width:.5em;height:.9em;background:var(--lit);box-shadow:0 0 10px rgba(62,224,160,.6);margin-left:.1em}
.mid{display:grid;place-items:center;min-height:0}
.bottom{text-align:center;padding-block:clamp(10px,2vh,20px) clamp(16px,3vh,28px)}
.line{margin:0;font-size:clamp(11px,1.2vw,14px);letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
.links{margin-top:10px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.links a{color:var(--dim);text-decoration:none}
.wallwrap{max-width:min(1040px,100%);width:100%;margin:0 auto}
.wall{display:block;width:100%;height:auto;max-height:min(68svh,620px)}
.trace{fill:none;stroke:var(--trace);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trace.lit{stroke:var(--lit-deep);stroke-width:2.5;filter:url(#glow)}
.box{fill:var(--box);stroke:var(--box-edge);stroke-width:1.2}
.box.lit{fill:url(#litfill);stroke:var(--lit);filter:url(#glow)}
.box.now{stroke:var(--now);stroke-width:1.6}
.ring{fill:none;stroke:var(--now);stroke-width:1.2;opacity:0;transform-origin:center;transform-box:fill-box}
.beta-l{font-size:11px;letter-spacing:.22em;text-transform:uppercase;fill:var(--ink2);text-anchor:middle}
.beta-l.lit{fill:var(--lit)}
.cap{font-size:11px;letter-spacing:.3em;text-transform:uppercase;fill:var(--ink2);text-anchor:middle}
.spark{fill:#fff;filter:url(#glow)}
@media (prefers-reduced-motion:no-preference){
  .cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
  .ring{animation:breathe 3.2s ease-in-out infinite}@keyframes breathe{0%{transform:scale(.92);opacity:0}35%{opacity:.6}100%{transform:scale(1.32);opacity:0}}
  .box.lit{animation:shimmer 7s ease-in-out infinite}@keyframes shimmer{0%,100%{opacity:1}50%{opacity:.86}}
}
@media (max-width:640px){.top{justify-content:center}.wall{max-height:none}}
</style>
</head>
<body>
<div class="field"><svg id="field" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg></div>
<svg class="grain" aria-hidden="true"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>

<main>
  <header class="top">
    <svg class="cube" id="cube" viewBox="0 0 300 300" role="img" aria-label="Euclid216 mark">
      <defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <radialGradient id="litfill" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#7cf0c0"/><stop offset=".55" stop-color="#3ee0a0"/><stop offset="1" stop-color="#13865e"/></radialGradient></defs>
    </svg>
    <h1 class="name" aria-label="Euclid216">EUCLID<b>216</b><span class="cur" aria-hidden="true"></span></h1>
  </header>
  <section class="mid" aria-label="Progress">
    <div class="wallwrap"><svg id="wall" class="wall" viewBox="0 0 1040 640" role="img" aria-label="Progress: lit boxes are complete"></svg></div>
  </section>
  <footer class="bottom">
    <p class="line" id="line">Built for agents, coming online soon.</p>
    <div class="links"><a href="/status.json">status.json</a> · <a href="/llms.txt">llms.txt</a></div>
  </footer>
</main>

<script>
(function(){
  const NS='http://www.w3.org/2000/svg';
  const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e;};
  // ---- digit field
  const f=document.getElementById('field'); let seed=216; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
  const W=1600,H=1000,cw=22,ch=30; f.setAttribute('viewBox',`0 0 ${W} ${H}`);
  for(let y=ch;y<H;y+=ch){for(let x=0;x<W;x+=cw){const t=mk('text',{x,y,'font-family':"'IBM Plex Mono',monospace",'font-size':'18',fill:rnd()<.04?'#2b333a':'#161b20'},f);t.textContent=Math.floor(rnd()*10);}}
  const d=mk('defs',{},f);d.innerHTML='<radialGradient id="vig" cx="50%" cy="50%" r="55%"><stop offset="0" stop-color="#050607" stop-opacity=".88"/><stop offset=".6" stop-color="#050607" stop-opacity=".5"/><stop offset="1" stop-color="#050607" stop-opacity="0"/></radialGradient>';
  mk('rect',{width:W,height:H,fill:'url(#vig)'},f);

  function render(S){
    // ---- cube: lit layers = online/of of 6 layers
    const cu=document.getElementById('cube'); [...cu.querySelectorAll('circle')].forEach(c=>c.remove());
    const n=6,s=24,ox=150,oy=180,litLayers=6*(S.online/S.of);
    const iso=(x,y,z)=>[ox+(x-y)*s*0.866, oy+(x+y)*s*0.5 - z*s];
    const cells=[];for(let z=0;z<n;z++)for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(x===n-1||y===n-1||z===n-1||x===0||y===0||z===0)cells.push([x,y,z]);}
    cells.sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2]));
    for(const [x,y,z] of cells){const [cx,cy]=iso(x,y,z);const lit=z<Math.floor(litLayers)||(z===Math.floor(litLayers)&&((x*7+y*3)%10)/10<(litLayers%1));
      const c=mk('circle',{cx,cy,r:lit?5.2:3.6,fill:lit?'#3ee0a0':'#2a3137'},cu);if(lit)c.setAttribute('filter','url(#glow)');}
    // ---- wall
    const svg=document.getElementById('wall'); svg.innerHTML='';
    const cols=[160,400,640,880], rows=[120,330,540], size=112, r=14, centres=[];
    for(let i=0;i<S.of;i++){const row=Math.floor(i/4),c=i%4;const x=(row%2===0)?cols[c]:cols[3-c];centres.push([x,rows[Math.min(row,2)]]);}
    const path=(pts)=>{if(pts.length<2)return'';let d=`M${pts[0][0]},${pts[0][1]}`;for(let i=1;i<pts.length;i++){const [x0,y0]=pts[i-1],[x1,y1]=pts[i];if(y0===y1||x0===x1)d+=` L${x1},${y1}`;else d+=` L${x0},${y1-Math.sign(y1-y0)*40} Q${x0},${y1} ${x0+Math.sign(x1-x0)*40},${y1} L${x1},${y1}`;}return d;};
    const litPts=centres.slice(0,Math.min(S.now,S.of));
    mk('path',{d:path(centres),class:'trace'},svg); mk('path',{d:path(litPts),class:'trace lit'},svg);
    centres.forEach(([x,y],i)=>{const n=i+1,lit=n<=S.online,now=n===S.now,beta=n===S.public_beta;
      if(now)mk('rect',{x:x-size/2-10,y:y-size/2-10,width:size+20,height:size+20,rx:r+6,class:'ring'},svg);
      mk('rect',{x:x-size/2,y:y-size/2,width:size,height:size,rx:r,class:'box'+(lit?' lit':'')+(now?' now':'')},svg);
      if(beta){const t=mk('text',{x,y:y+size/2+26,class:'beta-l'+(lit?' lit':'')},svg);t.textContent='public beta';}});
    if(litPts.length>1){const sp=mk('circle',{r:3.5,class:'spark'},svg);mk('animateMotion',{dur:'4.5s',repeatCount:'indefinite',path:path(litPts),calcMode:'spline',keySplines:'.4 0 .2 1',keyTimes:'0;1'},sp);}
    const cap=mk('text',{x:520,y:626,class:'cap'},svg);cap.textContent=`${S.online} of ${S.of} online`;
    document.getElementById('line').textContent=S.line||'Built for agents, coming online soon.';
  }
  const FALLBACK={line:'Built for agents, coming online soon.',online:4,of:11,now:5,public_beta:9};
  render(FALLBACK);
  fetch('status.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{if(j&&typeof j.online==='number')render(j);}).catch(()=>{});
})();
</script>
</body>
</html>
